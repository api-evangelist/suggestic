aid: suggestic
name: Suggestic
description: >-
  Suggestic is a personalized-nutrition and health platform that exposes a
  GraphQL API for building meal-planning, food-logging, and coaching
  applications. Developers use the API to create users, assign nutrition
  programs and diets, generate personalized meal plans, search a large recipe
  and restaurant database, log food (including AI photo-based logging), build
  shopping lists, and track sleep, steps, water, weight, heart rate, symptoms,
  biomarkers, and supplements. The platform also powers an AI Assistant with
  journeys and guardrails, a Console for configuration and webhooks, and a
  Telehealth/Coaching Portal. Suggestic (a Techstars-backed company) markets an
  enterprise AI offering for regulated health verticals and is HIPAA and SOC 2
  Type II certified. Authentication is via a server-side API token plus an
  sg-user header, or client-side JWT bearer tokens.
